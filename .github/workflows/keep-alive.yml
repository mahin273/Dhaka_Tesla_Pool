name: Keep Render Backend Awake

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          echo "Pinging Dhaka Tesla Pool Render backend..."
          status_code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://dhaka-tesla-pool-mahin.onrender.com/zones)
          echo "Render backend responded with HTTP status: $status_code"
